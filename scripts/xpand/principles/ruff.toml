# source: xpand plugin tools/principles @c0477d6
# Review system v3 ratchet only (spec 2026-10-06 §3.2). The blind-except rule is deliberately absent (catching Exception is not
# swallowing it). Ruff measures function size in statements: 50 statements ~ 80 lines.
# A PR must not hide its own files: ruff honours nested .gitignore/.ignore files and skips dirs like venv/ by default.
respect-gitignore = false
exclude = []

[lint]
select = ["C901", "PLR0915", "S110", "S112", "PGH004"]

[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-statements = 50
