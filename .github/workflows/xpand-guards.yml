name: xpand-guards
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: git remote add upstream https://github.com/dograh-hq/dograh.git && git fetch upstream main
      - run: bash scripts/xpand/tests/test_guards.sh
      - run: node --test scripts/xpand/pr-gate/pr-gate.test.mjs
      - run: bash scripts/xpand/check_no_ai_attribution.sh upstream/main
      # Every PR into the fork base, except the G0 PR itself (it is the one that resolves those conflicts).
      - if: github.base_ref == 'feat/foundations-base' && github.head_ref != 'feat/foundations-base-sync'
        env:
          FORK_BASE: origin/${{ github.base_ref }}
        run: bash scripts/xpand/check_fix_against_g0.sh 6c6cc6cb556da447ac488c849f25351f3c607ff2 "$FORK_BASE"
