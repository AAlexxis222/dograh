name: xpand-guards
on: [pull_request]

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git remote add upstream https://github.com/dograh-hq/dograh.git && git fetch upstream main
      - run: bash scripts/xpand/tests/test_guards.sh
      - run: bash scripts/xpand/check_no_claude_attribution.sh upstream/main
      - if: startsWith(github.head_ref, 'fix/')
        run: bash scripts/xpand/check_fix_against_g0.sh 6c6cc6cb556da447ac488c849f25351f3c607ff2 origin/feat/foundations-base

  pr-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test scripts/xpand/pr-gate/pr-gate.test.mjs
      - name: Check PR description (pr-ready sections, verdict, no attribution)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/xpand/pr-gate/check-body.mjs "$RUNNER_TEMP/pr-body.md" --no-attribution
